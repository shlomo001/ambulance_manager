version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ambulance_postgres_example
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambulance_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ambulance_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ambulance_backend_example
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:example_password@postgres:5432/ambulance_manager
      JWT_SECRET: your-super-secret-jwt-key-here
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-here
    depends_on:
      - postgres
    ports:
      - "3001:3001"
    networks:
      - ambulance_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: ambulance_frontend_example
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ambulance_network
    depends_on:
      - backend

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: ambulance_redis_example
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ambulance_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ambulance_network:
    driver: bridge
